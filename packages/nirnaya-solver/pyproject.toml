[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirnaya-solver"
version = "0.1.0"
description = "Deterministic two-phase revised simplex LP solver for Nirnaya"
requires-python = ">=3.10"
dependencies = ["nirnaya-core>=0.1.0", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
