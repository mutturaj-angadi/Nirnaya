[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirnaya-core"
version = "0.1.0"
description = "Mathematical foundation and stable interfaces for the Nirnaya GPU-accelerated optimization solver (SIH 2026, PS 26119, MRPL)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nirnaya Project" }]
keywords = [
    "optimization",
    "linear-programming",
    "sparse-matrix",
    "solver",
    "operations-research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/nirnaya-project/nirnaya-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nirnaya_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nirnaya_core"]
